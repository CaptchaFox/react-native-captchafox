name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 20 ships npm 10.
      - name: Update npm
        run: npm install -g npm@11.21.2

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        # v1.7.0 and later publish through OIDC when NPM_TOKEN is not set; v2 needs Changesets CLI v3.
        uses: changesets/action@v1.9.0
        with:
          publish: yarn run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          NPM_CONFIG_PROVENANCE: 'true'
